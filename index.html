<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Calculator Project | The Odin Project</title>
		<link rel="stylesheet" href="./css/style.css" />
	</head>
	<body>
		<header>
			<div class="wrapper">
				<h2>Calculator</h2>
				<a href="">Source Code</a>
			</div>
		</header>
		<main>
			<div class="wrapper">
				<div class="calculator-body">
					<div class="screen">
						<p class="input-field"></p>
						<p class="result-field"></p>
					</div>
					<div class="keypad">
						<div class="keypad-row">
							<button class="btn-clear">AC</button>
							<button>&PlusMinus;</button>
							<button>&percnt;</button>
							<button class="btn-operator btn-divide">/</button>
						</div>
						<div class="keypad-row">
							<button class="btn-number">7</button>
							<button class="btn-number">8</button>
							<button class="btn-number">9</button>
							<button class="btn-operator btn-multiply">x</button>
						</div>
						<div class="keypad-row">
							<button class="btn-number">4</button>
							<button class="btn-number">5</button>
							<button class="btn-number">6</button>
							<button class="btn-operator btn-subtract">-</button>
						</div>
						<div class="keypad-row">
							<button class="btn-number">1</button>
							<button class="btn-number">2</button>
							<button class="btn-number">3</button>
							<button class="btn-operator btn-add">+</button>
						</div>
						<div class="keypad-row">
							<button>SCI</button>
							<button class="btn-number">0</button>
							<button>.</button>
							<button class="btn-operator btn-equals">=</button>
						</div>
					</div>
				</div>
			</div>
		</main>
		<footer>
			<p class="copyright">&copy; 2026 Anxious Scripter</p>
		</footer>
		<script src="./js/main.js"></script>
	</body>
</html>
